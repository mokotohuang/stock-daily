name: 盤中更新加權指數

on:
  push:
    branches: ["main"]
  workflow_dispatch:
  schedule:
    - cron: "*/10 1-4 * * 1-5"
    - cron: "0,10,20,30,40 5 * * 1-5"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  update-intraday:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 下載網站內容
        uses: actions/checkout@v4

      - name: 設定 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: 取得盤中加權指數
        run: node scripts/update-intraday.mjs

      - name: 儲存盤中結果
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/intraday.json
          git diff --cached --quiet || git commit -m "Update intraday market data [skip ci]"
          git push

      - name: 設定 GitHub Pages
        uses: actions/configure-pages@v5

      - name: 上傳網站檔案
        uses: actions/upload-pages-artifact@v4
        with:
          path: "."

      - name: 發佈網站
        id: deployment
        uses: actions/deploy-pages@v4

