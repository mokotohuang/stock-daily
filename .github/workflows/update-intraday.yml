name: 盤中更新加權指數

on:
  push:
    branches: ["main"]
  workflow_dispatch:
  schedule:
    - cron: "*/10 1-4 * * 1-5"
    - cron: "0,10,20,30,40 5 * * 1-5"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  update-intraday:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 下載網站內容
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - name: 設定 Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "24"
          package-manager-cache: false

      - name: 取得盤中加權指數
        run: node scripts/update-intraday.mjs

      - name: 儲存盤中結果
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/intraday.json
          if git diff --cached --quiet; then
            echo "盤中資料沒有變更"
          else
            git commit -m "Update intraday market data [skip ci]"
            for attempt in 1 2 3; do
              git fetch origin main
              git rebase origin/main
              if git push origin HEAD:main; then
                break
              fi
              if [ "$attempt" -eq 3 ]; then
                echo "同步最新版本後仍無法推送"
                exit 1
              fi
              sleep $((attempt * 2))
            done
          fi

      - name: 設定 GitHub Pages
        uses: actions/configure-pages@v5

      - name: 上傳網站檔案
        uses: actions/upload-pages-artifact@v4
        with:
          path: "."

      - name: 發佈網站
        id: deployment
        uses: actions/deploy-pages@v4

